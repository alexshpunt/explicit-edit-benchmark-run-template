---
# yamllint disable rule:line-length
name: Run official benchmark

"on":
  workflow_dispatch:
    inputs:
      model:
        description: Exact registered model id
        required: true
        default: openai-codex/gpt-5.6-luna
        type: string
      thinking:
        description: Reasoning level
        required: true
        default: low
        type: choice
        options: ["off", low, medium, high, max]
      task:
        description: Registered task id; one task is a valid partial run
        required: true
        default: replace-all-10-plain
        type: string
      adapter:
        description: Adapter id from the benchmark registry
        required: true
        default: pi-default
        type: string
      agent_version:
        description: Exact published agent package version
        required: true
        type: string
      harness_version:
        description: Exact extension version; required only for pi-agent-ide
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  run:
    uses: alexshpunt/explicit-edit-benchmark/.github/workflows/official-run.yml@cfa0e8e0d1b6ea07146b52840eb462fc8c1af33c
    with:
      model: ${{ inputs.model }}
      thinking: ${{ inputs.thinking }}
      task: ${{ inputs.task }}
      adapter: ${{ inputs.adapter }}
      agent_version: ${{ inputs.agent_version }}
      harness_version: ${{ inputs.harness_version }}
      provider: openai-codex
    secrets:
      pi_auth_json: ${{ secrets.PI_AUTH_JSON }}

  submit:
    needs: run
    uses: alexshpunt/explicit-edit-benchmark/.github/workflows/official-submit.yml@a5b479e47e53814c57278491664ea83488dc358d
    with:
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      signer_sha: cfa0e8e0d1b6ea07146b52840eb462fc8c1af33c
      dataset_repository: alexshpunt/explicit-edit-benchmark
    secrets:
      hf_token: ${{ secrets.HF_TOKEN }}
