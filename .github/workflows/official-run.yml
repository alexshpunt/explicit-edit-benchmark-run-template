---
# yamllint disable rule:line-length
name: Run official benchmark

"on":
  workflow_dispatch:
    inputs:
      model:
        description: Exact registered model id
        required: true
        default: openai-codex/gpt-5.6-luna
        type: string
      provider:
        description: Provider id matching the model prefix
        required: true
        default: openai-codex
        type: string
      thinking:
        description: Reasoning level
        required: true
        default: low
        type: choice
        options: ["off", low, medium, high, max]
      suite:
        description: Benchmark suite
        required: true
        default: explicit-edit
        type: choice
        options: [explicit-edit, explicit-edit-multi-agent]
      task:
        description: Optional Explicit Edit task; Multi-Agent always runs all 71 tasks
        required: false
        default: ""
        type: string
      concurrency:
        description: Empty uses the suite default (10 or fixed 15 agents)
        required: false
        default: ""
        type: string
      adapter:
        description: Adapter id from the benchmark registry
        required: true
        default: pi-default
        type: string
      agent_version:
        description: Exact published agent package version
        required: true
        type: string
      harness_version:
        description: Exact extension version; required only for pi-agent-ide
        required: false
        default: ""
        type: string
      runtime_version:
        description: Exact auxiliary runtime version when required
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  run:
    uses: alexshpunt/explicit-edit-benchmark/.github/workflows/official-run.yml@36f42b57c68566590ae115783610656a4d1fc208
    with:
      model: ${{ inputs.model }}
      thinking: ${{ inputs.thinking }}
      suite: ${{ inputs.suite }}
      task: ${{ inputs.task }}
      concurrency: ${{ inputs.concurrency }}
      adapter: ${{ inputs.adapter }}
      agent_version: ${{ inputs.agent_version }}
      harness_version: ${{ inputs.harness_version }}
      runtime_version: ${{ inputs.runtime_version }}
      provider: ${{ inputs.provider }}
      policy_sha: 953eebfd55a880b66fb01f7d026a4ac79f55c0fa
    secrets:
      pi_auth_json: ${{ secrets.PI_AUTH_JSON }}

  submit:
    needs: run
    uses: alexshpunt/explicit-edit-benchmark/.github/workflows/official-submit.yml@953eebfd55a880b66fb01f7d026a4ac79f55c0fa
    with:
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      signer_sha: 36f42b57c68566590ae115783610656a4d1fc208
      policy_sha: 953eebfd55a880b66fb01f7d026a4ac79f55c0fa
      dataset_repository: alexshpunt/explicit-edit-benchmark
    secrets:
      hf_token: ${{ secrets.HF_TOKEN }}
