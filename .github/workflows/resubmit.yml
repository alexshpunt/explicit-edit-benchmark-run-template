---
# yamllint disable rule:line-length
name: Resubmit existing official result

"on":
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Original Run official benchmark workflow run id
        required: true
        type: string
      producer_attempt:
        description: Original workflow attempt
        required: true
        default: "1"
        type: string
      signer_sha:
        description: Original producer signer commit; use the original SHA for older results
        required: true
        default: "407313b0f72f81c95c36043d5d03aa774ca2b6cd"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  submit:
    uses: alexshpunt/explicit-edit-benchmark/.github/workflows/official-submit.yml@aadaa72e1d5f9ac59edcfc5c8bd773959aab222b
    with:
      producer_run_id: ${{ inputs.producer_run_id }}
      producer_attempt: ${{ inputs.producer_attempt }}
      signer_sha: ${{ inputs.signer_sha }}
      policy_sha: aadaa72e1d5f9ac59edcfc5c8bd773959aab222b
      dataset_repository: alexshpunt/explicit-edit-benchmark
    secrets:
      hf_token: ${{ secrets.HF_TOKEN }}
